# Document collection: the 10 papers from the Kalbe technical-assessment reading list.
# PDFs are NOT committed (licenses differ per paper); run scripts/download_papers.py.
# P7 uses the arXiv preprint (40 pages), not the Nature version.
#
# references_start_page / appendix_start_page: checked manually by opening each PDF.
# Pages labelled "references" are dropped before indexing (a bibliography matches many
# queries by keyword but never contains an answer).

